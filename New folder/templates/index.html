<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS AI Assistant | Live Cloud</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }
        body {
            background-color: #0A0A0C;
            color: #E2E8F0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Sidebar */
        .sidebar {
            width: 260px;
            background: #121318;
            border-right: 1px solid #1E2029;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }
        .btn-new-chat {
            background: linear-gradient(135deg, #25D366, #1DA851);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn-new-chat:hover {
            transform: translateY(-1px);
            opacity: 0.95;
        }
        .history-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748B;
            margin: 20px 0 10px 4px;
        }
        .session-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .session-item {
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(255,255,255,0.03);
            color: #CBD5E1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            transition: background 0.2s;
        }
        .session-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .session-item:hover, .session-item.active {
            background: rgba(37, 211, 102, 0.15);
            color: #25D366;
        }
        .btn-del-session {
            background: none;
            border: none;
            color: #64748B;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 6px;
            display: none;
        }
        .session-item:hover .btn-del-session {
            display: inline-block;
        }
        .btn-del-session:hover {
            color: #EF4444;
            background: rgba(239, 68, 68, 0.1);
        }
        .btn-clear-all {
            background: transparent;
            border: 1px solid #331111;
            color: #EF4444;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-clear-all:hover {
            background: #2D1215;
        }

        /* Main Chat Area */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0D0E12;
        }
        .header {
            height: 60px;
            border-bottom: 1px solid #1E2029;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: #121318;
        }
        .header h1 {
            font-size: 18px;
            color: #25D366;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .badge-status {
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .badge-status.online {
            background: rgba(37, 211, 102, 0.15);
            color: #25D366;
            border: 1px solid rgba(37, 211, 102, 0.3);
        }
        .badge-status.offline {
            background: rgba(239, 68, 68, 0.15);
            color: #EF4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .btn-mute-toggle {
            background: #1E2029;
            color: #FFF;
            border: 1px solid #334155;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-settings {
            background: #1E2029;
            color: #FFF;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 70%;
        }
        .message-row.user {
            align-self: flex-end;
        }
        .message-row.bot {
            align-self: flex-start;
        }
        .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
            position: relative;
        }
        .message-row.user .bubble {
            background: #25D366;
            color: #000;
            border-bottom-right-radius: 4px;
        }
        .message-row.bot .bubble {
            background: #1E2029;
            color: #F1F5F9;
            border-bottom-left-radius: 4px;
        }
        .sub-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
            font-size: 11px;
            color: #64748B;
            padding: 0 4px;
        }
        .message-row.user .sub-meta {
            color: #15803D;
        }
        .btn-copy {
            background: none;
            border: none;
            color: #94A3B8;
            cursor: pointer;
            font-size: 11px;
        }
        .btn-copy:hover {
            color: #FFF;
        }

        /* Input Box */
        .input-container {
            padding: 16px 24px;
            background: #121318;
            border-top: 1px solid #1E2029;
            display: flex;
            gap: 12px;
        }
        .chat-input {
            flex: 1;
            background: #1E2029;
            border: 1px solid #334155;
            padding: 14px 20px;
            border-radius: 24px;
            color: #FFF;
            font-size: 15px;
            outline: none;
        }
        .chat-input:focus {
            border-color: #25D366;
        }
        .btn-send {
            background: #25D366;
            color: #000;
            border: none;
            padding: 0 24px;
            border-radius: 24px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
        }

        /* Settings Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: #1E2029;
            width: 420px;
            padding: 24px;
            border-radius: 16px;
            border: 1px solid #334155;
        }
        .modal-content h2 {
            margin-bottom: 20px;
            color: #25D366;
            font-size: 18px;
        }
        .setting-item {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .setting-item.row {
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }
        .setting-item label {
            font-size: 14px;
            color: #CBD5E1;
        }
        .setting-item select, .setting-item input[type="range"], .setting-item input[type="text"] {
            background: #0D0E12;
            color: #FFF;
            border: 1px solid #334155;
            padding: 8px;
            border-radius: 6px;
            outline: none;
        }
        .setting-item input[type="text"]:focus {
            border-color: #25D366;
        }
        .btn-close-modal {
            width: 100%;
            background: #25D366;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <button class="btn-new-chat" onclick="createNewChat()">+ New Chat</button>
        <div class="history-title">Chat History</div>
        <div class="session-list" id="sessionList"></div>
        <button class="btn-clear-all" onclick="clearAllHistory()">🗑️ Clear All History</button>
    </div>

    <!-- Main Chat Pane -->
    <div class="main-chat">
        <div class="header">
            <h1>⚡ JARVIS AI ASSISTANT</h1>
            <div class="header-controls">
                <span id="statusBadge" class="badge-status online">🟢 AI Online</span>
                <button class="btn-mute-toggle" id="quickMuteBtn" onclick="toggleQuickMute()">🔊 Sound ON</button>
                <button class="btn-settings" onclick="toggleModal(true)">⚙ Settings</button>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="input-container">
            <input type="text" id="userInput" class="chat-input" placeholder="Ask Jarvis anything..." onkeypress="handleKey(event)">
            <button class="btn-send" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2>⚙ Preferences & Configuration</h2>
            <div class="setting-item row">
                <label>Voice Output (Browser TTS)</label>
                <input type="checkbox" id="voiceToggle" checked onchange="syncMuteBtn()">
            </div>
            <div class="setting-item row">
                <label>Speech Rate</label>
                <input type="range" id="speechRate" min="0.8" max="1.5" step="0.1" value="1.0">
            </div>
            <div class="setting-item row">
                <label>AI Model</label>
                <select id="modelSelect">
                    <option value="gemini-2.0-flash" selected>gemini-2.0-flash</option>
                    <option value="gemini-2.0-flash-lite">gemini-2.0-flash-lite</option>
                    <option value="gemini-2.5-flash">gemini-2.5-flash</option>
                </select>
            </div>
            <div class="setting-item">
                <label>Custom Gemini API Key (Optional)</label>
                <input type="text" id="apiKeyInput" placeholder="Paste new Gemini API Key here...">
                <small style="color: #64748B; font-size: 11px;">If limit expires, paste a new API key here to continue seamlessly.</small>
            </div>
            <button class="btn-close-modal" onclick="saveSettings()">Save & Close</button>
        </div>
    </div>

    <script>
        let currentSessionId = null;
        const synth = window.speechSynthesis;

        // Load saved API Key on startup
        const savedKey = localStorage.getItem('custom_gemini_api_key');
        if (savedKey) {
            document.getElementById('apiKeyInput').value = savedKey;
        }

        async function loadSessions() {
            try {
                const res = await fetch('/api/sessions');
                if (!res.ok) return;
                const sessions = await res.json();
                const listEl = document.getElementById('sessionList');
                listEl.innerHTML = '';
                
                if (sessions.length === 0) {
                    createNewChat();
                    return;
                }

                sessions.reverse().forEach(s => {
                    const item = document.createElement('div');
                    item.className = `session-item ${s.id === currentSessionId ? 'active' : ''}`;
                    
                    const titleSpan = document.createElement('span');
                    titleSpan.className = 'session-title-text';
                    titleSpan.innerText = `💬 ${s.title.substring(0, 20)}...`;
                    titleSpan.onclick = () => selectSession(s);

                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn-del-session';
                    delBtn.innerText = '🗑️';
                    delBtn.title = 'Delete Chat';
                    delBtn.onclick = (e) => deleteSession(e, s.id);

                    item.appendChild(titleSpan);
                    item.appendChild(delBtn);
                    listEl.appendChild(item);
                });
            } catch (e) {
                console.warn("Sessions load waiting for server wake-up...");
            }
        }

        async function createNewChat() {
            synth.cancel();
            try {
                const res = await fetch('/api/new_chat', { method: 'POST' });
                if (res.ok) {
                    const s = await res.json();
                    currentSessionId = s.id;
                    await loadSessions();
                    selectSession(s);
                    return;
                }
            } catch (e) {}
            // Fallback client session ID if server is cold-starting
            currentSessionId = 'chat_' + Date.now();
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            addBubble("Hello Sir, standing by for instructions.", "bot");
        }

        async function deleteSession(e, sid) {
            e.stopPropagation();
            synth.cancel();
            try {
                await fetch(`/api/session/${sid}`, { method: 'DELETE' });
            } catch (err) {}
            if (sid === currentSessionId) {
                currentSessionId = null;
            }
            await loadSessions();
        }

        async function clearAllHistory() {
            synth.cancel();
            try {
                await fetch('/api/sessions', { method: 'DELETE' });
            } catch (err) {}
            createNewChat();
        }

        function selectSession(s) {
            currentSessionId = s.id;
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            (s.messages || []).forEach(m => addBubble(m.text, m.sender, m.timestamp));
            loadSessions();
        }

        function addBubble(text, sender, timeStr) {
            const container = document.getElementById('chatMessages');
            const row = document.createElement('div');
            row.className = `message-row ${sender}`;

            const now = timeStr || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            row.innerHTML = `
                <div class="bubble">${text}</div>
                <div class="sub-meta">
                    <span>${now}</span>
                    ${sender === 'bot' ? `<button class="btn-copy" onclick="navigator.clipboard.writeText('${text.replace(/'/g, "\\'")}')">📋 Copy</button>` : ''}
                </div>
            `;
            container.appendChild(row);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const msg = input.value.trim();
            if (!msg) return;

            if (!currentSessionId) {
                currentSessionId = 'chat_' + Date.now();
            }

            synth.cancel();
            input.value = '';

            // Render user message bubble immediately
            addBubble(msg, 'user');

            const model = document.getElementById('modelSelect') ? document.getElementById('modelSelect').value : "gemini-2.5-flash";
            const apiKey = document.getElementById('apiKeyInput') ? document.getElementById('apiKeyInput').value.trim() : "";

            // Instant typing indicator
            const container = document.getElementById('chatMessages');
            const typingRow = document.createElement('div');
            typingRow.className = 'message-row bot';
            typingRow.id = 'typingIndicator';
            typingRow.innerHTML = '<div class="bubble" style="opacity: 0.7; font-style: italic;">⚡ Jarvis is thinking...</div>';
            container.appendChild(typingRow);
            container.scrollTop = container.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        session_id: currentSessionId, 
                        message: msg, 
                        model: model,
                        api_key: apiKey 
                    })
                });

                // Remove typing indicator
                const indicator = document.getElementById('typingIndicator');
                if (indicator) indicator.remove();

                if (!res.ok) {
                    addBubble(`Server notice (HTTP ${res.status}): Render service is warming up or temporarily busy. Please wait a moment and try again.`, 'bot');
                    return;
                }

                const data = await res.json();
                
                // Update API Status Badge
                const badge = document.getElementById('statusBadge');
                if (data.api_status === 'offline') {
                    badge.className = 'badge-status offline';
                    badge.innerText = '🔴 AI Offline';
                } else {
                    badge.className = 'badge-status online';
                    badge.innerText = '🟢 AI Online';
                }

                addBubble(data.reply, 'bot', data.timestamp);
                speak(data.reply);
                if (data.action_url) {
                    window.open(data.action_url, '_blank');
                }
                loadSessions();
            } catch (err) {
                const indicator = document.getElementById('typingIndicator');
                if (indicator) indicator.remove();
                addBubble("Connectivity notice: Unable to connect to backend server. If using Render, please wait 30 seconds while the free instance wakes up.", 'bot');
            }
        }

        function speak(text) {
            if (!document.getElementById('voiceToggle').checked) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = parseFloat(document.getElementById('speechRate').value);
            synth.speak(utterance);
        }

        function toggleQuickMute() {
            const toggle = document.getElementById('voiceToggle');
            toggle.checked = !toggle.checked;
            if (!toggle.checked) synth.cancel();
            syncMuteBtn();
        }

        function syncMuteBtn() {
            const isChecked = document.getElementById('voiceToggle').checked;
            const btn = document.getElementById('quickMuteBtn');
            btn.innerText = isChecked ? "🔊 Sound ON" : "🔇 Muted";
            btn.style.borderColor = isChecked ? "#334155" : "#EF4444";
            btn.style.color = isChecked ? "#FFF" : "#EF4444";
        }

        function saveSettings() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('custom_gemini_api_key', key);
            } else {
                localStorage.removeItem('custom_gemini_api_key');
            }
            toggleModal(false);
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function toggleModal(show) {
            document.getElementById('settingsModal').style.display = show ? 'flex' : 'none';
        }

        window.onload = loadSessions;
    </script>
</body>
</html>
